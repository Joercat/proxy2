<!DOCTYPE html>
<html>
<head>
    <title>Learning AI Chat</title>
    <style>
        #chat-container {
            width: 500px;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            margin: 20px auto;
        }
        #input-container {
            width: 500px;
            margin: 0 auto;
            display: flex;
        }
        #user-input {
            flex: 1;
            padding: 10px;
        }
        .message {
            margin: 5px;
            padding: 10px;
            border-radius: 5px;
            position: relative;
        }
        .user-message {
            background-color: #e3f2fd;
            text-align: right;
        }
        .ai-message {
            background-color: #f5f5f5;
        }
        .feedback-buttons {
            display: none;
            position: absolute;
            right: 10px;
            top: -20px;
        }
        .ai-message:hover .feedback-buttons {
            display: block;
        }
        .feedback-button {
            cursor: pointer;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        let lastUserMessage = '';
        let lastAiResponse = '';

        function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value;
            if (message.trim() === '') return;

            lastUserMessage = message;
            addMessage(message, 'user-message');
            
            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({message: message})
            })
            .then(response => response.json())
            .then(data => {
                lastAiResponse = data.response;
                addMessage(data.response, 'ai-message');
            });

            input.value = '';
        }

        function addMessage(message, className) {
            const container = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = message;
            
            if (className === 'ai-message') {
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback-buttons';
                feedbackDiv.innerHTML = `
                    <span class="feedback-button" onclick="sendFeedback('positive')">👍</span>
                    <span class="feedback-button" onclick="sendFeedback('negative')">👎</span>
                `;
                messageDiv.appendChild(feedbackDiv);
            }
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function sendFeedback(type) {
            fetch('/feedback', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    user_message: lastUserMessage,
                    ai_response: lastAiResponse,
                    feedback: type
                })
            });
        }

        // Handle Enter key
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
